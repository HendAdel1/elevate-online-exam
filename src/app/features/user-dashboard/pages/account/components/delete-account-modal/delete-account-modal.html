@if (open) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm font-geist"
  role="dialog" aria-modal="true" aria-labelledby="delete-account-title"
  (click)="$event.target === $event.currentTarget && close()">
  <div class="relative w-full max-w-md bg-white p-8 border border-gray-100 text-center"
    (click)="$event.stopPropagation()">
    <button type="button" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600 p-1" (click)="close()"
      aria-label="Close">
      <lucide-icon name="x" class="size-4.5" />
    </button>

    <div
      class="mx-auto mb-4 flex size-20 items-center justify-center rounded-full bg-red-100 shadow-[0_0_0_12px_rgba(254,242,242,0.9)]">
      <lucide-icon name="alert-triangle" class="size-13 text-red-600" [strokeWidth]="1" [absoluteStrokeWidth]="true" />
    </div>

    <h2 id="delete-account-title" class="text-lg font-bold text-red-600 mb-2">
      Are you sure you want to delete your account?
    </h2>
    <p class="text-sm text-gray-500 mb-6">This action is permanent and cannot be undone.</p>

    @if (errorMessage) {
    <p class="text-sm text-red-600 mb-4">{{ errorMessage }}</p>
    }

    <div class="flex gap-3 justify-center w-full bg-gray-50">
      <button type="button"
        class="w-full border border-gray-200 bg-gray-100 px-5 py-3.5 text-sm font-medium text-gray-800 hover:bg-gray-200 cursor-pointer"
        (click)="close()">
        Cancel
      </button>
      <button type="button" [disabled]="deleting"
        class="w-full bg-red-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-red-700 disabled:opacity-60"
        (click)="confirmDelete()">
        Yes, delete
      </button>
    </div>
  </div>
</div>
}
