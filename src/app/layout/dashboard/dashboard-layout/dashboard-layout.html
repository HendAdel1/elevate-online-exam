<div class="h-screen flex overflow-hidden">
  <app-toast-layer />

  <!-- Sidenav  - left side -->
  <div [class.w-90]="!isCollapsed" [class.w-20]="isCollapsed" class="transition-all duration-300">
    <app-sidenav [theme]="theme" [navLinks]="navLinks" [isCollapsed]="isCollapsed" (toggle)="onToggle()"></app-sidenav>
  </div>

  <!-- Content - right side -->
  <div class="flex-1 flex flex-col overflow-y-auto">
    <app-breadcrumb></app-breadcrumb>
    <div class="flex-1 p-6 flex flex-col bg-gray-50">
      <app-dashboard-header></app-dashboard-header>
      <div class="flex-1 flex flex-col">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

</div>
