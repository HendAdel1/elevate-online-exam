<div class="relative">
    <div class="flex items-center gap-2.5">

    <!-- Avatar -->
    <div class="border border-blue-600 w-13.5 h-13.5 flex justify-center items-center">
        <img src="images/logo-black.svg" alt="user-image" class="w-full h-full object-cover">
    </div>

    <!-- User info -->
    <div class="font-geist flex-1">
        <h3 class="text-blue-600 text-md">Firstname</h3>
        <p class="text-gray-500 text-sm truncate">user-email@example.com</p>
    </div>

    <!-- Actions -->
    <div class="cursor-pointer" (click)="toggleMenu(); $event.stopPropagation()">
        <i-lucide class="text-gray-500 hover:text-blue-600 transition-colors" name="ellipsis-vertical" [size]="18" [strokeWidth]="1" [absoluteStrokeWidth]="true"></i-lucide>
    </div>
</div>



<!-- Dropdown -->
<ul
  class="absolute right-0 -top-40 shadow-sm z-10 bg-gray-100 transition-all duration-200 ease-out origin-top w-40"
  [class.opacity-0]="!isOpen"
  [class.opacity-100]="isOpen"
  [class.scale-95]="!isOpen"
  [class.scale-100]="isOpen"
  [class.pointer-events-none]="!isOpen"
>
    <li class="flex items-center gap-1 p-4 cursor-pointer group transition-colors hover:bg-blue-100">
        <i-lucide class="text-gray-500 transition-colors group-hover:text-blue-500" name="user-round" [size]="18" [strokeWidth]="1" [absoluteStrokeWidth]="true"></i-lucide>
        <p class="text-gray-800 text-sm transition-colors group-hover:text-blue-500">Account</p>
    </li>
    <li class="flex items-center gap-1 p-4 cursor-pointer group transition-colors hover:bg-blue-100">
        <i-lucide class="text-gray-500 transition-colors group-hover:text-blue-500" name="bolt" [size]="18" [strokeWidth]="1" [absoluteStrokeWidth]="true"></i-lucide>
        <p class="text-gray-800 text-sm transition-colors group-hover:text-blue-500">Dashboard</p>
    </li>
    <li class="flex items-center gap-1 p-4 cursor-pointer group transition-colors hover:bg-red-100">
        <i-lucide class="text-red-600 group-hover:text-red-600" name="log-out" [size]="18" [strokeWidth]="1" [absoluteStrokeWidth]="true"></i-lucide>
        <p class="text-red-600 text-sm group-hover:text-red-600">Logout</p>
    </li>
</ul>


</div>
