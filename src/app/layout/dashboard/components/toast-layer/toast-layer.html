<div class="pointer-events-none fixed bottom-6 right-6 z-100 flex max-w-md flex-col gap-2 sm:max-w-lg"
  aria-live="polite">
  @for (t of toast.toasts(); track t.id) {
  <div
    class="pointer-events-auto flex items-center gap-3 rounded-none border border-gray-800 bg-gray-900 px-5 py-4 text-sm text-white shadow-lg"
    role="status">
    @if (t.kind === 'success') {
    <lucide-icon name="check" class="size-5 shrink-0 text-green-500" />
    } @else {
    <lucide-icon name="circle-x" class="size-5 shrink-0 text-red-400" />
    }
    <span class="font-geist leading-snug">{{ t.message }}</span>
  </div>
  }
</div>
