@if (message) {
<div
  class="relative flex items-center justify-center text-sm bg-red-50 border border-red-600 text-red-600 px-4 py-2 my-3">
  <i-lucide name="circle-x" [size]="18" [strokeWidth]="1.5"
    class="mr-2 absolute -top-1/4 left-28 bg-gray-50 rounded-2xl"></i-lucide>
  <span>{{ message }}</span>
</div>
}
